name: demos

# Render the VHS tapes in docs/tapes into GIFs and commit them back. Runs on
# changes to the tapes, the tools, or this workflow.
on:
  push:
    branches: [trunk]
    paths:
      - "docs/tapes/**"
      - "cmd/**"
      - "internal/**"
      - ".github/workflows/demos.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          # ttyd: grab a static release binary (not always in apt).
          sudo curl -fsSL \
            https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64 \
            -o /usr/local/bin/ttyd
          sudo chmod +x /usr/local/bin/ttyd
          go install github.com/charmbracelet/vhs@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build tools onto PATH
        run: |
          mkdir -p bin docs/img
          go build -o bin ./cmd/...
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Render every tape
        run: |
          shopt -s nullglob
          for tape in docs/tapes/*.tape; do
            echo "Rendering $tape"
            vhs "$tape"
          done

      - name: Commit refreshed GIFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain docs/img)" ]; then
            git add docs/img
            git commit -m "regenerate demo gifs"
            git push
          else
            echo "No GIF changes to commit."
          fi
